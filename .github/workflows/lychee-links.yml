name: Check Links

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.lycheeignore'
      - '.github/workflows/lychee-links.yml'
      - 'docs/nav.json'
      - 'docs/redirects.txt'
      - '.github/check-docs-nav.py'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.lycheeignore'
      - '.github/workflows/lychee-links.yml'
      - 'docs/nav.json'
      - 'docs/redirects.txt'
      - '.github/check-docs-nav.py'

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-path target
            '**/*.md'
          fail: true

  docs-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check docs navigation and frontmatter
        run: python3 .github/check-docs-nav.py
